[book]
title = "vaster"
description = "Raster grid logic, without any pesky data."
authors = ["Michael Sumner"]
language = "en"
src = "src"

[rust]
edition = "2021"

[output.html]
git-repository-url = "https://github.com/hypertidy/vaster-rs"
edit-url-template = "https://github.com/hypertidy/vaster-rs/edit/main/book/{path}"
site-url = "/vaster-rs/"
default-theme = "light"
preferred-dark-theme = "ayu"

[output.html.fold]
enable = false
